esearch","title":"مدلسازی ساختاری تفسیری عوامل موثر بر کسب و کارهای پلتفرمی هوشمند","cover":"https://www.jnabm.ir/data/jnabm/coversheet/cover_fa.jpg","date":{"y":1403,"m":7,"d":12},"summary":"در دنیای امروز، کسب و کارهای پلتفرمی هوشمندبه عنوان یک مدل کسب و کار جدید و نوظهور، رو به رشد است.","body":"در دنیای امروز، کسب و کارهای پلتفرمی هوشمندبه عنوان یک مدل کسب و کار جدید و نوظهور، رو به رشد است. این نوع کسب و کارها از طریق ارائه خدمات و محصولات از طریق یک پلتفرم هوشمند دیجیتال به مشتریان خود متصل می‌شوند. اما بوجود آمدن این نوع کسب و کارها با خود چالش‌ها و عوامل موثر مختلفی همراه است که برای موفقیت و پایداری آنها باید این عوامل شناسایی و اهمیتشان مشخص شوند تا بر اساس آن بتوان بهترین استراتژی را در پیش گرفت. این پژوهش از نظر هدف کاربردی و از نظر گردآوری اطلاعات، پیمایشی می‌باشد. بر این اساس ابتدا با بررسی پیشینه پژوهش عوامل موثر بر موفقیت کسب و کارهای پلتفرمی هوشمند استخراج شد که شامل 14 عامل موثر می‌باشد. این عوامل طی یک پرسشنامه از نظر 10 خبره پژوهش تایید شدند. خبره‌ها دارای حداقل سابقه کار 10 سال در کسب و کارهای اینترنتی و فعال در فروشگاه اینترنتی عموکالا می‌باشند همچنین در بخش‌های فروش و بازرگانی فروشگاه‌های اینترنتی فعالیت داشته‌اند. بعد از تایید معیارها، توسط روش ISM سطح‌بندی شدند. نتایج نشان داد مدل پژوهش شامل 8 سطح می‌باشد که سطح هشتم یعنی معیار اعتماد و ارتباط با مشتری تاثیرگذارترین سطح است که به صورت مستقیم بر روی معیار موجود در سطح هفتم یعنی وفاداری به برند و تصویر می‌شود. همچنین دو معیار قیمت محصولات و کیفیت محصولات که در سطح اول هستند تاثیرپذیرترین معیارها می‌باشند به بیان دیگر کلیه معیارها به نحوی بر روی قیمت محصولات و کیفیت محصولات تاثیر می‌گذارند.\n\n\n\u003ca class=\"sbtn\" href=\"https://www.jnabm.ir/article_714753.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["تفکر سیستمی","منابع انسانی"],"related":["a-2"],"link":"","authors":"مسعود شکری","year":"1403","price":"","status":"","featured":true,"visible":true,"comments":[],"slug":"ism-smart-platform-business"},{"id":"a-2","kind":"article","subtype":"research","title":"نگاشت شناختی فازی عوامل مؤثر بر تصمیم گیری جهت دیجیتال شدن مدیریت منابع انسانی","cover":"https://journal.saim.ir/data/mrdm/coversheet/401790089861.png","date":{"y":1403,"m":1,"d":25},"summary":"دیجیتالی‌شدن مدیریت منابع انسانی به دلیل پیشرفت در فناوری و نیاز به مدیریت کارآمد نیروی کار به‌طور فزاینده‌ای در سازمان‌های مدرن فراگیر شده است. ","body":"دیجیتالی‌شدن مدیریت منابع انسانی به دلیل پیشرفت در فناوری و نیاز به مدیریت کارآمد نیروی کار به‌طور فزاینده‌ای در سازمان‌های مدرن فراگیر شده است. در این زمینه، درک عوامل مؤثر بر تصمیم‌گیری به سمت دیجیتالی‌شدن مدیریت منابع انسانی برای سازمان‌هایی که به دنبال استفاده مؤثر از فناوری برای دستیابی به اهداف استراتژیک منابع انسانی هستند، حیاتی است. لذا هدف پژوهش این است که اولاً عوامل مؤثر بر تصمیم گیری جهت دیجیتالی‌شدن مدیریت منابع انسانی چیست و ثانیاً این عوامل، چه روابطی با هم دارند. پژوهش حاضر از نظر جهت‌گیری پژوهش، نوعی پژوهش کاربردی، به لحاظ رویکردهای پژوهش، استقرایی و از نظر استراتژی‌های پژوهش، ترکیبی (کیفی-کمی) محسوب می‌شود. ابتدا برای شناسایی عوامل مؤثر بر تصمیم گیری جهت مدیریت منابع انسانی دیجیتال با 11 نفر از خبرگان این حوزه مصاحبه نیمه‌ساختار یافته انجام شد. نمونه‌گیری خبرگان به‌صورت گلوله برفی بوده است. سپس با استفاده از روش تحلیل مضمون، مصاحبه‌ها تحلیل شدند و عوامل به دست آمد. در گام دوم برای کشف روابط بین عوامل استخراج شده، از روش نگاشت شناختی فازی استفاده شد. نتایج نشان داد که این عوامل، به ترتیب عبارت‌اند از: فرهنگ سازمانی (86/0)، تخصیص منابع و سرمایه‌گذاری (83/0)، زیرساخت فناوری (79/0)، رهبری و چشم‌انداز (73/0)، تغییر پذیرش و مقاومت (69/0)، ساختار سازمانی و حاکمیت (62/0)، اندازه و پیچیدگی سازمانی (58/0)، مهارت‌ها و مشارکت کارکنان (54/0)، امنیت داده‌ها و حریم خصوصی (48/0)، سفارشی‌سازی و شخصی‌سازی (45/0). همچنین روابط هر مولفه با زیرمولفه‌های آن نیز مشخص شد و پیشنهاداتی جهت استفاده از یافته‌های پژوهش بیان شد.\n\n\n\u003ca class=\"sbtn\" href=\"https://journal.saim.ir/article_716237.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e","tags":["مدیریت منابع انسانی"],"related":[],"link":"","authors":"مسعود شکری","year":"1403","price":"","status":"","featured":true,"visible":true,"comments":[],"slug":"fcm-hrm-digital"},{"id":"imvmuh7g9mea2","kind":"article","subtype":"research","title":"نگاشت شناختی فازی عوامل کلیدی موفقیت در بازاریابی دیجیتال در کسب‌وکارهای کوچک و متوسط","cover":"https://bar.yazd.ac.ir/data/bar/coversheet/cover_fa.jpg","date":{"y":1402,"m":8,"d":2},"summary":"به‌کارگیری نوآوری‌های فناورانه در فعالیت‌های بازاریابی، همواره بر مزیت رقابتی و عملکرد کسب‌وکارها تأثیرگذار بوده است و بازاریابی الکترونیکی سهم مهمی را در این موضوع ایفا می‌کند.","body":"به‌کارگیری نوآوری‌های فناورانه در فعالیت‌های بازاریابی، همواره بر مزیت رقابتی و عملکرد کسب‌وکارها تأثیرگذار بوده است و بازاریابی الکترونیکی سهم مهمی را در این موضوع ایفا می‌کند. لذا، هدف پژوهش حاضر، شناسایی عوامل کلیدی موفقیت بازاریابی الکترونیکی در کسب‌وکارهای کوچک و متوسط و کم و کیف روابط بین این عوامل می‌باشد. این پژوهش، نوعی پژوهش کاربردی، به لحاظ رویکردهای پژوهش، استقرایی و از نظر استراتژی­‌های پژوهش، ترکیبی (کیفی-کمّی) محسوب می­‌شود. ابتدا، برای شناسایی عوامل کلیدی موفقیت بازاریابی الکترونیکی با 11 نفر از خبرگان این حوزه مصاحبۀ نیمه‌­­ساختار یافته انجام شد. نمونه‌­گیری خبرگان به ­صورت گلوله برفی بود. سپس با استفاده از روش تحلیل مضمون، مصاحبه‌ها تحلیل شدند و عوامل کلیدی موفقیت بازاریابی الکترونیکی به دست آمد که عبارت­اند از: میزان بازدید و تردد وب‌سایت، بهینه‌­سازی موتورهای جستجو، جذب کاربر جدید یا سرنخ­سازی، جذب ردیابی شبکه‌­های اجتماعی و تبلیغات پولی. در گام دوم، برای کشف روابط بین عوامل استخراج شده، از روش نگاشت‌شناختی فازی استفاده شد. نتایج نشان داد که عوامل کلیدی موفقیت در بازاریابی الکترونیکی در کسب­وکارهای کوچک و متوسط، به ترتیب عبارت­اند از: تبلیغات پولی (83/0)، میزان بازدید و ترافیک وب‌سایت (73/0)، بهینه‌­سازی موتورهای جستجو (62/0)، جذب کاربر جدید یا سرنخ‌سازی (56/0) و جذب ردیابی شبکه‌­های اجتماعی (43/0). همچنین روابط هر مؤلفه با زیرمؤلفه­‌های آن نیز مشخص و در نهایت، پیشنهاداتی جهت استفاده از یافته­‌های پژوهش بیان شد.\n\n\n\u003ca class=\"sbtn\" href=\"https://bar.yazd.ac.ir/article_3052.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["کسب‌وکار"],"related":["a-2","a-1"],"link":"","authors":"مسعود شکری","year":"1402","price":"","status":"","featured":false,"visible":true,"comments":[],"slug":"fcm-digital-marketing-sme"},{"id":"b-1","kind":"book","title":"مدلسازی اجتماعی","cover":"https://book.mehrestan.ir/wp-content/uploads/2024/08/%D8%AC%D9%84%D8%AF-%D9%85%D8%AF%D9%84-%D8%B3%D8%A7%D8%B2%DB%8C-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-1401.8.22-min.jpg","date":{"y":1401,"m":4,"d":1},"summary":"مدل، تصویری ساده‌شده و قابل‌فهم از واقعیت و ارتباط میان مفاهیم است که برای حل مسئله یا انتقال یافته‌ها به کار می‌رود و به تحلیل بهتر و تصمیم‌گیری مناسب‌تر کمک می‌کند.","body":"مدل\" بازنمایی قابل فهم‌تری از واقعیت موجود است. مدل‌سازی زمانی مورد استفاده قرار می‌گیرد که محقق به منظور حل مسئله‌ای از دنیای واقعی یا ارائۀ یافته‌هایش، تصویری از ارتباط میان مفاهیم را به نمایش می گذارد، تصویری که در حد فهم و درک مخاطب بوده و ابزاری برای ارتفاء قدرت تحلیل و تفکر و اتخاذ مناسب‌ترین تصمیمات است.\nمدل‌‎ها، انواع گوناگونی داشته و کاربردهای حیاتی متنوع و فراوانی در همۀ زمینه‌های علوم و فناوری دارند، اما به کارگیری آن‌ها در مسائل فرهنگی و اجتماعی جامعه که از قضا تعداد متغیرهای درگیر زیاد و ارتباطات پیچیده هستند، کم‌رنگ می باشد. تک‌نگاشت حاضر با مروری بر مفاهیم مدل‌سازی، انواع مدل‌ها، فرایندها و کاربردها راهنمایی برای استفاده از این ابزار به ویژه در مسائل فرهنگی و اجتماعی است.\n\nکتاب مدل سازی اجتماعی با مروری بر مفاهیم مدل سازی، انواع مدل ها، فرایندها و کاربردها راهنمایی برای استفاده از این ابزار به ویژه در مسائل فرهنگی و اجتماعی است.\n\n \n\nبخشی از کتاب مدل سازی اجتماعی\nبدیهی است بخشی از مسیر زندگی هر شخصی کاملاً وابسته به سلسله تصمیمات و اقداماتی است که در برخورد با روندها و رویدادهای پیش رو اتخاذ می‌نماید. بخشی از تصمیمات صحیح و عاقلانه برمی‌گردد به تفکر و اندیشۀ قوی و صحیح که منشأ این تفکر در واقع، همان مدل ذهنی یا به‌عبارتی دیگر، ارتباط میان مفاهیم و استنتاجاتی است که در ذهن افراد شکل می‌گیرد و منشأ عمل می‌شود. اما در بسیاری از موارد، رسیدن به مدل مناسب برای انتخاب شایسته و اقدام به کار، خارج از توان ذهنی یک فرد بوده و نیاز به تشریح و تحلیل و استفاده از تجربیات و نظرات سایرین و بعضاً استفاده از نرم‌افزارهای محاسباتی دارد. در خصوص جامعه و مسائل جامعه نیز وضع به همین منوال است. تصمیمات افراد در سطوح مختلف جامعه است که مسیر حیات جامعه را شکل می‌دهد. شاید تصمیمات و اقدامات افراد در نگاه اول، مدیریت‌ناپذیر و خارج از کنترل ‌باشد؛ اما دانش و تجربۀ بشری نشان داده که پیچیده‌ترین و غیرمنتظره‌ترین رفتارها نیز قابل مدل‌سازی و تحلیل و بررسی است. در واقع، بخش مهمی از دانش موردنیاز حکمرانان و سیاست‌گذاران برای مدیریت جامعه، مشتمل بر فهم روابط علّی میان پدیده‌ها، قدرت پیش‌بینی زودهنگام و نحوۀ جهت‌دهی به روندها و اتفاقات آینده است و ادعای ما این است که مدل‌ها در تمامی این موارد نه‌تنها کاربردی، بلکه موردنیاز هستند.\n\nحل مسائل پیچیدۀ دنیای واقعی، ارزیابی راه‌حل‌های پیشنهادی و انتقال صحیح، سریع و حداکثری یافته‌های علمی منتج‌شده از پروژه‌های تحقیقاتی و طرح‌های پژوهشی به مخاطبین جامعۀ هدف، دغدغه‌ای است که محققین در حین حل مسئله و مستندسازی نتایج، همواره در سر دارند. از طرفی، استفاده‌کنندگان از یافته‌های علمی و پژوهشی نیز از کلی‌گویی‌ها و مطالب تشریحی با طول و تفصیل فراوان ملول گشته و به‌دنبال دریافت اصل مطلب در قالب تعداد محدودی پاراگراف، جدول، نمودار و یا شکل هستند. هرچه جامعۀ استفاده‌کننده از یافته‌های علمی، از محققین و پژوهشگران در مراکز علمی به‌سمت مدیران و مجریان در عرصه‌های اجرایی حرکت می‌کند و هرچه طرح از مراحل مفهومی و نظری به‌سمت عملیاتی‌شدن پیش می‌رود، نیاز بیشتری به زبانی ساده، گویا و صریح برای انتقال سریع مفاهیم احساس می‌شود. الگو، مدل، نقشه، طرح و... مفاهیمی هستند که با کاستن از پیچیدگی‌های دنیای واقعی به‌گونه‌ای که به ماهیت موضوع خدشه وارد نشود، زمینۀ فهم کارکرد سیستم یا فرایند و نیز ارزیابی تصمیمات و انتقال سریع مفاهیم و یافته‌ها به جامعۀ هدف را تسهیل می‌کنند. به‌علاوه، هر تصمیمی که توسط فرد یا گروهی از افراد اتخاذ و اجرا شود، پیامدهایی را به‌ دنبال خواهد داشت و این پیامدها می‌تواند جامعه‌ای را تحت‌تأثیر قرار دهد. انسان منطقی در سطح تصمیمات فردی، برای اتخاذ یک تصمیمِ هرچند کوچک، سعی می‌کند جوانب امر و پیامدهای آن را قبل از اجرا در ذهن خود تصویرسازی کند و از مدل‌های ذهنی خود بهره گیرد؛ اما هرچه ابعاد و روابط میان متغیرهای مؤثر در مسئله‌ای بیشتر، شرایط پیچیده‌تر و آینده، آمیخته با عدم قطعیت باشد و پیامدهای تصمیم، جامعۀ بزرگ‌تری را تحت‌تأثیر خود قرار دهد، نیاز به جمع‌آوری اطلاعات و استفاده از ابزارهای تسهیل‌گر، نظیر نرم‌افزارهای تحلیلی و محاسباتی، بیشتر احساس می‌شود. در چنین شرایطی، کاربردی‌ترین راه‌حل به‌منظور فهم، تصمیم‌سازی و ارزیابی تصمیمات، «مدل‌سازی» است. در مواردی که اقدامات درنظرگرفته‌شده پیامدهای جبران‌ناپذیرتر و پرهزینه‌تری را به دنبال دارد، بیشتر نیاز است که قبل از هرگونه تصمیم و اقدام، مواردی نظیر شبیه‎سازی شرایط دنیای واقعی در یک مقیاس آزمایشی، آگاهی از آینده‌های محتمل و بررسی پیامدهای ناظر به هر تصمیم در دستور کار قرار گیرد.\n\n\n\n\u003ca class=\"sbtn\" href=\"https://book.mehrestan.ir/product/%D9%85%D8%AF%D9%84-%D8%B3%D8%A7%D8%B2%DB%8C-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C/#book_summery_link\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eخرید کتاب\u003c/a\u003e\n\n\n\n\u003ca class=\"sbtn\" href=\"https://taaghche.com/book/200669/%D9%85%D8%AF%D9%84-%D8%B3%D8%A7%D8%B2%DB%8C-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدریافت نسخه الکترونیک کتاب\u003c/a\u003e\n\n","tags":["سیستم‌ها"],"related":["a-1","imvnhm353fank"],"link":"","authors":"مسعود شکری","year":"1401","price":"","status":"","featured":false,"visible":true,"comments":[],"slug":"social-modeling"},{"id":"n-1","kind":"note","title":"ذهنِ خسته در دنیای همیشه‌ آنلاین","cover":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShobxRh1-37fikIUW8ZYNOZ_H_5Jiu_D2uxp2JlIoJKA\u0026s","date":{"y":1405,"m":8,"d":2},"summary":"در جهانی که همیشه‌آنلاین بودن تبدیل به یک وضعیت عادی شده، ذهن ما دارد بهای سنگینی می‌پردازد؛ بهایی که اغلب آن را نمی‌بینیم، یا وقتی متوجهش می‌شویم که خیلی دیر شده است.","body":"در جهانی که همیشه‌آنلاین بودن 📱💻 تبدیل به یک وضعیت عادی شده، ذهن ما دارد بهای سنگینی می‌پردازد؛ بهایی که اغلب آن را نمی‌بینیم، یا وقتی متوجهش می‌شویم که خیلی دیر شده است. هر روز با هزاران پیام، اعلان، ایمیل، ویدیوی کوتاه و نوتیفیکیشن 🚨📩📲 بمباران می‌شویم؛ اما شاید کمتر به این فکر کنیم که این همه ورودی، ذهن ما را از درون خسته و فرسوده کرده است.\n\n\u003cb\u003e😓 خستگی‌ای که به چشم نمی‌آید\u003c/b\u003e\n\nما عادت کرده‌ایم خستگی را فقط در بدن‌مان ببینیم اما ذهن هم عضوی از ماست که خسته می‌شود، حتی بیشتر از بدن. این خستگی پنهان خودش را در قالب‌هایی مثل این نشان می‌دهد:\n\n🔄 کاهش تمرکز و حواس‌پرتی دائمی\n\n❓ احساس پوچی یا بی‌انگیزگی با وجود فعالیت زیاد\n\n💡 کاهش خلاقیت\n\n🌙 خواب بی‌کیفیت\n\n⚡ اضطراب و آشفتگی درونی بدون دلیل واضح\n\n\u003cb\u003e⚖️ دنیای همیشه‌آنلاین: فرصت یا دام؟\u003c/b\u003e\nدرست است؛ تکنولوژی به ما فرصت‌های زیادی داده است.\nحالا می‌توانیم در هر لحظه یاد بگیریم 📚، ارتباط برقرار کنیم 🗣، کار کنیم 👩‍💻، و حتی رشد کنیم 🌱.\nاما اگر هوشیار نباشیم، این فرصت‌ها تبدیل به دام‌هایی می‌شوند که ما را از خودمان دور می‌کنند.\nهمیشه‌آنلاین بودن، ذهن ما را از حالت \"عمیق\" 🧘‍♂️ به حالت \"سطحی\" ⏩ می‌برد. دیگر کمتر فکر می‌کنیم، کمتر می‌نویسیم، کمتر با خودمان خلوت می‌کنیم.\n\n\u003cb\u003e🔄 راهکارهایی برای احیای ذهن خسته\u003c/b\u003e\n\n\u003ci\u003e⏳ ساعت‌های بدون صفحه (Screen-free Time)\u003c/i\u003e\n\nهر روز حتی ۱ ساعت را به زندگی بدون گوشی، لپ‌تاپ یا تلویزیون اختصاص بده.\n🏞 پیاده‌روی، ✍️ نوشتن با خودکار، یا فقط 🧘 نشستن و فکر کردن.\n\n\u003ci\u003e🎯 تمرین «یک کار در یک زمان»\u003c/i\u003e\n\nمولتی‌تسکینگ ⚙️ نه تنها بازدهی را بالا نمی‌برد، بلکه باعث تحلیل رفتن انرژی ذهنی می‌شود. روی یک کار تمرکز کن 🔍 تا ذهن فرصت نفس کشیدن داشته باشد.\n\n\u003ci\u003e📉 رژیم اطلاعاتی\u003c/i\u003e\n\nآیا واقعاً لازم است این‌همه محتوا را در یک روز مصرف کنیم؟ مقدار مصرف محتوای دیجیتال را کاهش بده و منابع ارزشمند را گلچین کن 🌷.\n\n\u003ci\u003e🌬 تنفس دیجیتال\u003c/i\u003e\n\nقبل از باز کردن گوشی، یک دم و بازدم عمیق انجام بده. این مکث ساده، ذهن را از «عادت» به «آگاهی» می‌برد 🧘‍♀️📴.\n\n\u003ci\u003e✍️ نوشتن\u003c/i\u003e\n\nنوشتن افکار روی کاغذ، ذهن را تخلیه می‌کند.\n🖋 هر چیزی آزارت می‌دهد؟ بنویس.\nذهنت شلوغه؟ بنویس.\nنوشتن یعنی سکوتی برای ذهن.\n\n\u003cb\u003e🌿 یک دعوت ساده\u003c/b\u003e\n\nدر پایان، این یادداشت نه هشدار است و نه نکوهش. فقط یک دعوت است:\nدعوتی برای بازگشت به خود.\nبه ذهنی که نیاز دارد شنیده شود، نه فقط پر شود.\n🌼 شاید اولین قدم برای آرام‌سازی ذهن، فقط یک تصمیم باشد:\nگاهی \u003cb\u003eآفلاین\u003c/b\u003e بودن، یعنی واقعاً زندگی کردن. 📴🌈","tags":["سبک زندگی دیجیتال"],"related":[],"link":"","authors":"","year":"","price":"","status":"","featured":false,"visible":true,"comments":[{"name":"[نمونه] علی","rating":5,"text":"[نمونه] نظر نمونه برای امتحان بخش نظرها.","reply":"[نمونه] پاسخ نمونه."}],"slug":"tired-mind-always-online"},{"id":"n-2","kind":"note","title":"موهبت آفلاین بودن","cover":"https://tse2.mm.bing.net/th/id/OIP.3AQRX-EiLIjTInMm6m0XdAHaEK?r=0\u0026rs=1\u0026pid=ImgDetMain\u0026o=7\u0026rm=3","date":{"y":1405,"m":7,"d":25},"summary":"در دنیای امروز که ارتباطات به سرعت در فضای آنلاین جریان دارند، احساس می‌کنیم که باید همیشه در دسترس باشیم. ","body":"در دنیای امروز که ارتباطات به سرعت در فضای آنلاین جریان دارند، احساس می‌کنیم که باید همیشه در دسترس باشیم. گوشی‌های هوشمند و پیام‌رسان‌ها باعث شده‌اند که این انتظار در میان اطرافیانمان شکل بگیرد که باید سریع به هر پیامی پاسخ بدهیم، اما این همیشه در دسترس بودن می‌تواند به ضرر خودمان باشد.\n\nآفلاین بودن، در واقع یک موهبت است. زمانی که از فضای آنلاین فاصله می‌گیریم، نه تنها به خودمان اجازه می‌دهیم که استراحت کنیم، بلکه فرصت داریم تا به روابط واقعی و ارزشمندتر بپردازیم. یکی از مزایای بزرگ آفلاین بودن این است که انتظار از ما کاهش می‌یابد. وقتی که همیشه آنلاین هستیم، اطرافیان ممکن است این برداشت را پیدا کنند که ما باید سریع پاسخ بدهیم و در دسترس باشیم. این فشار می‌تواند استرس زا باشد و ما را در موقعیت‌هایی قرار دهد که حتی برای استراحت هم زمان نداریم.\n\nدر گذشته، نامه‌نگاری یکی از روش‌های رایج ارتباطی بود. گاهی برای یک جواب، هفته‌ها منتظر می‌ماندیم. این زمان انتظار، خود نوعی صبر و دقت به رابطه بود. در آن دوران، افراد کمتر توقع داشتند که در هر لحظه و هر زمان جوابی فوری دریافت کنند. این فاصله زمانی، به نوعی باعث عمق بخشیدن به ارتباطات و درک بهتر از یکدیگر می‌شد.\n\nاما امروزه، سرعت ارتباطات و تسهیل آن‌ها به قدری افزایش یافته که مفهوم چشم انتظاری و صبر دیگر معنی ندارد. در عین حال، این سرعت و فوریت در پاسخگویی می‌تواند منجر به از دست دادن توجه و تمرکز در زمان‌های حیاتی زندگی شود.\n\n\u003cb\u003eپیشنهادهایی برای آفلاین بودن:\u003c/b\u003e\n\nیکی از ساده‌ترین راه‌ها برای ایجاد فضای آفلاین در زندگی، این است که خودتان را برای ساعاتی از روز از شبکه‌های اجتماعی و پیام‌رسان‌ها دور کنید. می‌توانید زمانی خاص در طول روز (مثلاً یک ساعت بعد از شام یا آخر شب) را برای خودتان تعیین کنید و به اطرافیان خود اطلاع دهید که در آن ساعت آفلاین خواهید بود. این کار به شما کمک می‌کند که احساس آزادی بیشتری داشته باشید و در عین حال به اطرافیان نیز می‌فهماند که شما در زمان‌های خاصی در دسترس نیستید.\n\nآفلاین بودن نه تنها به نفع شماست، بلکه به روابط شما نیز کمک می‌کند. وقتی از فضای آنلاین فاصله می‌گیرید، ارتباطات واقعی‌تر و عمیق‌تری خواهید داشت. پس این فرصت را غنیمت بشمارید و گاهی از دنیای آنلاین فاصله بگیرید تا به خودتان و دیگران فرصت بدهید تا لحظات آرام و واقعی‌تری را تجربه کنید.","tags":["سبک زندگی دیجیتال"],"related":["n-1"],"link":"","authors":"","year":"","price":"","status":"","featured":false,"visible":true,"comments":[{"name":"gdfbdf","rating":5,"text":"sbsd","reply":"bsdbdb"},{"name":"","rating":5,"text":"","reply":""}],"slug":"offline-blessing"},{"id":"n-3","kind":"note","title":"ابزارگرایی افراطی - وقتی ابزار، جای اصل را می‌گیرد","cover":"https://img.freepik.com/premium-vector/person-appears-overwhelmed-surrounded-by-variety-digital-tools-creative-supplies-their-workspace-overwhelmed-customizable-disproportionate-illustration_538213-148096.jpg","date":{"y":1405,"m":7,"d":10},"summary":"در دنیای دیجیتال امروز، ابزارها هر روز متنوع‌تر، جذاب‌تر و پیشرفته‌تر می‌شوند. نرم‌افزارها، اپلیکیشن‌ها، پلتفرم‌ها و قالب‌ها با وعده‌ی بهره‌وری بیشتر، خلاقیت بالاتر و نظم بهتر، ما را دعوت به تجربه‌ی خود می‌کنند.","body":"در دنیای دیجیتال امروز، ابزارها هر روز متنوع‌تر، جذاب‌تر و پیشرفته‌تر می‌شوند. نرم‌افزارها، اپلیکیشن‌ها، پلتفرم‌ها و قالب‌ها با وعده‌ی بهره‌وری بیشتر، خلاقیت بالاتر و نظم بهتر، ما را دعوت به تجربه‌ی خود می‌کنند. اما در این مسیر پر زرق و برق، یک خطر بزرگ در کمین ماست: ابزارگرایی افراطی. که باید در سبک زندگی دیجیتال خود به این نکته توجه کنیم.\nیعنی چه؟ یعنی وقتی به‌جای پرداختن به اصل ماجرا، درگیر انتخاب و مقایسه‌ی ابزار می‌شویم. وقتی به‌جای عمل کردن، درگیر آماده شدن برای عمل می‌مانیم. این مسئله به‌ویژه برای کسانی که به دنبال رشد فردی، نوشتن، تولید محتوا یا ساخت برند شخصی هستند، بیشتر به چشم می‌آید.\n\n\u003cb\u003eمثال‌هایی آشنا از دام ابزارگرایی\u003c/b\u003e\n\u003ci\u003eیادداشت‌نویسی:\u003c/i\u003e\nهدف ما از یادداشت‌نویسی چیست؟ ثبت افکار، سازماندهی ایده‌ها و بازگشت به آن‌ها در زمان مناسب. اما گاهی به‌جای نوشتن، ساعت‌ها درباره‌ی ابزار نوشتن فکر می‌کنیم.\nکاغذی یا دیجیتال؟ اگر دیجیتال، با چه نرم‌افزاری؟ Notion؟ Obsidian؟ OneNote؟ Evernote؟ کدام فونت بهتر است؟ تم تاریک یا روشن؟ ساختار پوشه‌ها چگونه باشد؟\nو در این میان، اصل یادداشت‌نویسی به حاشیه می‌رود و حس رضایتِ کاذبی از پیشرفت در ما شکل می‌گیرد، در حالی که هنوز یک یادداشت درست‌وحسابی ننوشته‌ایم.\n\n\u003ci\u003eساخت وب‌سایت شخصی:\u003c/i\u003e\nوب‌سایت شخصی قرار است خانه‌ی دیجیتال ما باشد؛ جایی برای انتشار افکار، رزومه، نوشته‌ها یا نمونه‌کارها. اما به‌جای تمرکز بر محتوا، غرق در قالب‌ها، رنگ‌ها، افکت‌ها و افزونه‌ها می‌شویم. ده‌ها ساعت صرف تغییر فونت و چیدمان می‌کنیم ولی هنوز هیچ مقاله‌ای منتشر نشده، هیچ خدمتی معرفی نشده، هیچ محتوایی تولید نشده.\n\n\u003ci\u003eضبط پادکست یا ویدیو:\u003c/i\u003e\nمی‌خواهیم یک پادکست شروع کنیم؟ عالی! اما گیر می‌افتیم در انتخاب میکروفون، نرم‌افزار تدوین، صداگذاری، پس‌زمینه، پلتفرم انتشار. در نهایت پروژه‌مان تبدیل می‌شود به یک تحقیق بی‌پایان درباره‌ی تجهیزات، بدون حتی یک دقیقه محتوای واقعی.\n\n\u003cb\u003eپس باید ابزارها را کنار گذاشت؟\u003c/b\u003e\nنه دقیقاً. مشکل، خود ابزار نیست. مشکل آن‌جاست که ابزار به هدف تبدیل می‌شود.\nما باید ابزار را در خدمت هدف نگه داریم، نه اینکه هدف‌مان بشود پیدا کردن بهترین ابزار.\nابزار خوب، اگر در زمان مناسب و به اندازه استفاده شود، می‌تواند واقعاً به ما کمک کند. اما اگر منتظر بمانیم تا بهترین ابزار را پیدا کنیم و بعد شروع کنیم، ممکن است هیچ‌وقت شروع نکنیم.\nهمچنین نباید به یک ابزار بچسبیم و از تغییر فرار کنیم. اگر واقعاً ابزار بهتری آمد که متناسب با نیازمان بود، تعویض آن اشکالی ندارد — به شرطی که مسیر ما را قطع نکند، بلکه تسهیل کند.\n\n\u003cb\u003e🔹 جمع‌بندی:\u003c/b\u003e\nدر مسیر رشد دیجیتال، همیشه این سوال را از خودمان بپرسیم:\n\"آیا دارم کار اصلی‌ام را انجام می‌دهم؟ یا فقط در حال آماده‌سازی برای انجامش هستم؟\"","tags":["سبک زندگی دیجیتال"],"related":["n-2","n-1"],"link":"","authors":"","year":"","price":"","status":"","featured":false,"visible":true,"comments":[],"slug":"extreme-toolism"},{"id":"p-1","kind":"project","title":"Planora","cover":"","date":{"y":1405,"m":3,"d":1},"summary":"برنامه‌ریز شخصی برای مدیریت کارها و زمان. (توضیح نمونه)","body":"","tags":["برنامه‌ریزی","ابزار شخصی"],"related":[],"link":"","authors":"","year":"","price":"","status":"active","featured":false,"visible":true,"comments":[]},{"id":"p-2","kind":"project","title":"صحیفه سجادیه","cover":"","date":{"y":1404,"m":10,"d":1},"summary":"برنامه‌ی خواندن تعاملی برای مرور روزانه‌ی متن. (توضیح نمونه)","body":"","tags":["متن","خواندن"],"related":[],"link":"","authors":"","year":"","price":"","status":"active","featured":false,"visible":true,"comments":[]},{"id":"p-3","kind":"project","title":"TRANSVIA","cover":"","date":{"y":1404,"m":4,"d":1},"summary":"چارچوب ارزیابی گذار برای سیاست‌گذاری. (توضیح نمونه)","body":"","tags":["گذار","ارزیابی"],"related":[],"link":"","authors":"","year":"","price":"","status":"done","featured":false,"visible":true,"comments":[]},{"id":"m-1","kind":"product","title":"[نمونه] عنوان محصول","cover":"","date":{"y":1405,"m":5,"d":1},"summary":"توضیح کوتاه نمونه برای محصول.","body":"","tags":["خدمات"],"related":[],"link":"","authors":"","year":"","price":"[قیمت نمونه]","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvmyvicnkgv4","slug":"sme-banking-access-iran","kind":"article","subtype":"research","title":"شناسایی و رتبه‌بندی راهکارهای ارتقاء دسترسی کسب‌وکارهای کوچک و متوسط به خدمات بانکی در ایران","cover":"https://jed.ut.ac.ir/data/jed/coversheet/cover_fa.jpg","date":{"y":1401,"m":10,"d":10},"summary":"توسعه کسب‌وکارهای کوچک و متوسط، عاملی مهم در توسعه اقتصادی کشورها محسوب‌ می‌شود و همه اقتصاددانان بر اهمیت این موضوع در رونق تولید و رشد اقتصاد اتفاق‌نظر دارند.","body":"توسعه کسب‌وکارهای کوچک و متوسط، عاملی مهم در توسعه اقتصادی کشورها محسوب‌ می‌شود و همه اقتصاددانان بر اهمیت این موضوع در رونق تولید و رشد اقتصاد اتفاق‌نظر دارند. بااین‌حال علیرغم اهمیت فراوان این کسب‌وکارها در اقتصاد، فقدان دسترسی مناسب آن‌ها به منابع مالی، به‌عنوان یکی از مهم‌ترین موانع رشد این نوع کسب‌وکارها شناخته می‌شود. روش‌های مختلفی جهت تأمین مالی کسب‌وکارهای کوچک و متوسط وجود دارد، اما با توجه به ساختار بانک محور اقتصاد ایران و عدم توسعه‌یافتگی ابزارهای مالی جایگزین، همچنان بانک‌ها نقش محوری در تأمین مالی این کسب‌وکارها ایفا می‌کنند. مسئله اصلی این پژوهش ارائه راهکارهایی جهت تسهیل دسترسی کسب‌وکارهای کوچک و متوسط به خدمات بانکی ایران و سپس اولویت‌بندی این راهکارهاست. پژوهش حاضر بر اساس هدف کاربردی و بر اساس نحوه گردآوری داده‌ها توصیفی_پیمایشی محسوب می‌شود. در پژوهش حاضر، ضمن بررسی تجارب جهانی و منابع علمی مرتبط با موضوع و همچنین استفاده از نظر خبرگان حوزه بانکی و کارآفرینی 38 راهکار ارتقاء دسترسی کسب و کارهای کوچک و متوسط به خدمات بانکی با روش تحلیل مضمون شناسایی و تحلیل شده، سپس با روش تاپسیس اولویت‌بندی شدند.\n\n\n\u003ca class=\"sbtn\" href=\"https://jed.ut.ac.ir/article_89931.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["کسب‌وکار"],"related":["a-1","imvmuh7g9mea2"],"link":"","authors":"مسعود شکری","year":"1401","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvmyhyrc62r6","slug":"ssm-in-strategy","kind":"article","subtype":"research","title":"فراترکیب روش‌شناسی نظام‌های نرم در تحلیل‌های مدیریت راهبردی","cover":"https://www.jipas.ir/data/jipas/coversheet/cover_fa.jpg","date":{"y":1399,"m":1,"d":29},"summary":"یکی از روش‌شناسی‌هایی که در حل مسائل پیچیده به مدیریت راهبردی کمک می‌کند روش‌شناسی نظام‌های نرم است. مسائل مدیریت راهبردی در دنیای واقعی شکل می‌گیرند. ","body":"یکی از روش‌شناسی‌هایی که در حل مسائل پیچیده به مدیریت راهبردی کمک می‌کند روش‌شناسی نظام‌های نرم است. مسائل مدیریت راهبردی در دنیای واقعی شکل می‌گیرند. امروزه محیط نهادها و سازمان‌ها پیچیده‌تر و پویاتر از گذشته است و روش‌های تحقیق در عملیاتِ سخت، پاسخگوی مسائل راهبردی نیستند. به همین منظور، تمرکز عمده بر روش‌های تحقیق در عملیات نرم می‌تواند کمک بیشتری به حل مسائل پیچیده مدیریت راهبردی در زمان کمتر و با دقت بیشتر کند. در برنامه‌ریزی راهبردی سازمان‌ها در ایران، مسائلی همچون عدم پاسخگوییِ بهینه برخی از تکنیک‌های رایج به تغییرات و تحولات محیطی و همچنین کم‌توجهی به مطالعات روش‌شناسی نظام‌های نرم در مقایسه با مطالعات متعارف در فرایند مدیریت راهبردی وجود دارد؛ بنابراین، هدف از این مقاله، فراترکیب روش‌شناسی نظام‌های نرم در فرایند مدیریت راهبردی است. براین‌اساس، مطالعات روش‌شناسی نظام‌های نرم در تدوین، اجرا و کنترل راهبردی، شناسایی و معرفی شده‌اند. در این پژوهش از 808 مقاله شناسایی شده در زمینه روش‌شناسی نظام‌های نرم، 73 مقاله مرتبط با موضوع‌های مدیریت راهبردی انتخاب شد و پس از حذف مقاله‌های تکراری مشخص شد که در ادبیات متعارف، از روش‌شناسی نظام‌های نرم، در 67 موضوع مدیریت راهبردی استفاده شده است. در پایان، این موضوع‌ها بر اساس فرایند مدیریت راهبردی ذیل هر یک از مراحل تدوین، اجرا و کنترل راهبردی دسته‌بندی شدند.\n\n\n\u003ca class=\"sbtn\" href=\"https://www.jipas.ir/article_119812.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["روش‌شناسی سیستمی","استراتژی"],"related":["a-1"],"link":"","authors":"مسعود شکری","year":"1399","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvmyl7yfc856","slug":"fcm-auditor-competency","kind":"article","subtype":"research","title":"نگاشت فازی مدل شایستگی حسابرسان دیوان محاسبات کشور - پایان نامه","cover":"","date":{"y":1400,"m":6,"d":28},"summary":"منابع انسانی، اصلی ترین سرمایه هر سازمان است که بسیار ارزشمند بوده و به راحتی قابل جایگزینی نیست و باعث کسب مزیت رقابتی پایدار می شود.","body":"منابع انسانی، اصلی ترین سرمایه هر سازمان است که بسیار ارزشمند بوده و به راحتی قابل جایگزینی نیست و باعث کسب مزیت رقابتی پایدار می شود. یکی از ملزومات و پیش نیازهای مدیریت منابع انسانی، شناسایی شایستگی هاست. شایستگی می تواند پیش بینی کننده عملکرد فرد در سازمان باشد و با موفقیت شغلی در ارتباط است. سازمان ها پیش از هر فعالیتی برای مدیریت منابع انسانی، باید شایستگی های موردنیاز برای مشاغل مهم خود را تعریف کنند. دیوان محاسبات کشور، به عنوان یک دستگاه حاکمیتی از طریق حسابرسی، تفریغ بودجه و رسیدگی، بر عملکرد دستگاه های اجرایی نظارت می کند و در جهت پاسداری از بیت المال، پیشگیری از فساد، کشف و افشاء به موقع و برخط تخلفات، استفاده مناسب، کارآمد و اثربخش از امکانات، اموال و وجوه عمومی ایفای نقش می نماید. اجرای ماموریت دیوان محاسبات کشور بدین صورت انجام می گردد که فعالیت حسابرسی دستگاه های اجرایی که به طریقی از بودجه کل کشور استفاده می نمایند، به صورت پروژه ای و توسط حسابرسان در سطوح مختلف، صورت می پذیرد و هسته اصلی کسب وکار در این دیوان، حسابرسی است. لذا شناسایی مدل شایستگی حسابرسان که یکی از مهم ترین سرمایه ی انسانی دیوان محاسبات کشور محسوب می شوند، امری ضروری است. در این پژوهش، ابتدا با بررسی کامل ادبیات موجود، شایستگی های حسابرسان شناسایی شد. سپس با مراجعه به کتاب شریف نهج البلاغه، با روش تحلیلی توصیفی، شایستگی ها تکمیل گردید و مدل جامع شایستگی حسابرسان دیوان محاسبات استخراج شد. این مدل شامل 70 شایستگی، در 6 دسته است که شامل شایستگی های عمومی، شایستگی های رفتاری، شایستگی های فنی، شایستگی های دانشی، شایستگی های مدیریتی و مهارت های ارتباطی می باشد. در نهایت، این شایستگی ها در قالب پرسشنامه به خبرگان (حسابرسان دیوان محاسبات) ارائه شد و نگاشت فازی این شایستگی ها ترسیم شد. شایستگی های فنی، شایستگی های رفتاری و شایستگی های عمومی به ترتیب اهمیت بیشتری دارند.\n\n\n\u003ca class=\"sbtn\" href=\"https://civilica.com/doc/2444950/\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل پایان نامه\u003c/a\u003e\n\n","tags":["مدیریت منابع انسانی","روش‌شناسی سیستمی"],"related":["a-2","imvmuh7g9mea2"],"link":"","authors":"مسعود شکری","year":"1400","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvmz0347mm6m","slug":"family-governance-diagnosis-iran","kind":"article","subtype":"research","title":"عارضه‌یابی و تحلیل نظام حکمرانی امور خانواده در جمهوری اسلامی ایران","cover":"https://www.jwss.ir/data/jwss/coversheet/961734624129.jpg","date":{"y":1401,"m":7,"d":12},"summary":"مقولۀ خانواده و مسائل این حوزه، چند لایه‌ای، چند بعدی و گسترده هستند و لذا سازمان‌ها و نهادهای متعددی در سطوح مختلف با محوریت حوزه خانواده ایجاد شده‌اند.","body":"مقولۀ خانواده و مسائل این حوزه، چند لایه‌ای، چند بعدی و گسترده هستند و لذا سازمان‌ها و نهادهای متعددی در سطوح مختلف با محوریت حوزه خانواده ایجاد شده‌اند. این سازمان‌ها و نهادها که برخی حاکمیتی و برخی غیرحاکمیتی هستند را می‌توان به مثابۀ سیستمی در نظر گرفت که به‌منظور تحقق اهدافی مشخص در کنار هم قرار گرفته‌اند. در تحقیق انجام شده قصد بر این بوده تا بررسی شود نهادها و سازمان‌هایی که برنامه‌ریزی‌شده یا بدون برنامه مشخصی به‌وجود آمده‌اند مانایی و کارایی لازم را برای تحقق اهداف عالیه‌ای که در خصوص تحکیم و تعالی خانواده در اسناد بالادستی جمهوری اسلامی ایران ترسیم شده، دارند یا خیر و چه عارضه‌هایی بر ساختار و کارکرد این سیستم مترتب است. نوآوری پژوهش استفاده از مدل سیستم مانا (VSM) به‌منظور عارضه‌یابی نظام حکمرانی امور خانواده است. یافته‌ها نشان می‌دهد می‌توان سازمان‌ها و نهادهای موجود را در حکم سیستمی درنظر گرفت که ایجاد شده‌اند تا وظایف حکمرانی را در خصوص مقولۀ خانواده ایفا ‌کنند، اما برای مانا بودن این سیستم‌ بایستی مدیر (مالک) فرایندها و ساز و کار اندازه‌گیری عملکرد اجزا مشخص شود. پس از ﻋﺎرﺿﻪ یابی نیز چند ﭘﻴﺸﻨﻬﺎد ﻛﺎرﺑﺮدی اراﺋﻪ ﮔﺮدﻳﺪه است.\n\n\n\u003ca class=\"sbtn\" href=\"https://www.jwss.ir/article_170571.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["مدل سیستم مانا","حکمرانی"],"related":["a-3"],"link":"","authors":"مسعود شکری","year":"1401","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"a-3","kind":"article","subtype":"research","title":"به‌گزینی نهاد متولی نظام حکمرانی خانواده در جمهوری اسلامی ایران","cover":"https://cwfs.ihu.ac.ir/data/cwfs/coversheet/661676268887.jpg","date":{"y":1401,"m":10,"d":8},"summary":"یکی از مباحث مهم در حوزه خانواده که در سال‌های اخیر در کشور مطرح بوده، تعیین ساختاری برای حمایت از خانواده و کمک به تحکیم بنیان خانواده در کشور است اما هنوز پاسخ مناسب و قانع‌کننده‌ای برای آن ارائه نشده است.","body":"یکی از مباحث مهم در حوزه خانواده که در سال‌های اخیر در کشور مطرح بوده، تعیین ساختاری برای حمایت از خانواده و کمک به تحکیم بنیان خانواده در کشور است اما هنوز پاسخ مناسب و قانع‌کننده‌ای برای آن ارائه نشده است. این پژوهش به دنبال اصلاح نظام حکمرانی خانواده از طریق تعیین و یا ایجاد ساختاری است که به‌عنوان متولی فرایند فعالیت نماید. پژوهش حاضر کاربردی است و به روش آمیخته (کیفی-کمی) انجام شده است. در بخش کیفی، ضمن آسیب‌شناسی نظام حکمرانی خانواده با روش مدل سیستم مانا (VSM)، مصاحبه‌های نیمه ساختاریافته عمیق با 25 نفر از خبرگان که به‌صورت نمونه‌گیری هدفمند انتخاب شده بودند، به‌منظور شناسایی ساختارهای پیشنهادی نهاد متولی نظام خانواده صورت گرفت و با استفاده از روش تحلیل محتوا، ساختارهای پیشنهادی شناسایی شد. در بخش کمّی، ساختارهای پیشنهادی شناسایی شده در قالب یک پرسشنامه و با هدف اولویت‌بندی آن‌ها به خبرگان عرضه شد و پس از آن با روش تاپسیس (TOPSIS) اولویت‌بندی انجام شد. نتایج نشان‌دهنده این است که از بین 9 ساختار پیشنهادی در اولویت اول، سازمان راهبری خانواده ذیل مجمع تشخیص مصلحت نظام یا شورای عالی انقلاب فرهنگی است که فراقوه‌ای بوده و ثبات رویکرد بیشتری در آن نمایان است و در اولویت بعدی سازمان ملی خانواده (معاونت ریاست جمهوری) است که ضمانت اجرایی در آن مشهودتر و قابل تحقق‌تر است.\n\n\n\u003ca class=\"sbtn\" href=\"https://cwfs.ihu.ac.ir/article_207730.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["مدل سیستم مانا","حکمرانی"],"related":["a-2","imvmuh7g9mea2"],"link":"","authors":"مسعود شکری","year":"1401","price":"","status":"","featured":false,"visible":true,"comments":[],"slug":"family-governance-iran-vsm"},{"id":"imvmyqyvbsb9k","slug":"","kind":"article","subtype":"research","title":"بررسی ظرفیت نمایشگاه های ملی در حمایت از تولید ملی (مورد مطالعه: نمایشگاه توانمندی های روستاییان و عشایر)","cover":"https://bsrq.cuir.ac.ir/data/bsrq/coversheet/411651320514.jpg","date":{"y":1400,"m":7,"d":10},"summary":"حمایت از تولید ملی یکی از ارکان اصلی سیاست های اقتصاد مقاومتی است، لذا شناسایی راهکارها و ایده هایی که زمینه تقویت تولید ملی را فراهم آورد را میتوان در راستای تحقق این سیاستها دانست.","body":"حمایت از تولید ملی یکی از ارکان اصلی سیاست های اقتصاد مقاومتی است، لذا شناسایی راهکارها و ایده هایی که زمینه تقویت تولید ملی را فراهم آورد را میتوان در راستای تحقق این سیاستها دانست. نمایشگاه های ملی دارای ظرفیت های ویژه ای برای توسعه و ترویج امر تولید در عمده کشورها هستند در پژوهش حاضر که با رویکرد کتابخانه ای- پیمایشی انجام‌شده، ظرفیت های مختلفی که در یک نمایشگاه ملی برای حمایت از تولید داخل فراهم می شود، شناسایی شده است. سپس با پیمایش صورت گرفته در چهارمین نمایشگاه توانمندی‌های روستائیان و عشایر که با رویکرد و شعار محوری تبیین نقش روستائیان و عشایر در تحقق سیاست های رونق تولید در تابستان 1398 برگزار شد، این ظرفیت ها به طور دقیق و موردی مورد ارزیابی قرار گرفته اند. برای انجام این پژوهش، 194 پرسشنامه توسط غرفه داران نمایشگاه مذکور تکمیل گردید و در گام پایانی، تجزیه و تحلیل داده های گردآوری شده با استفاده از روش تاپسیس، انجام گرفت. نتایج نشان می دهد که متاسفانه حدود نیمی از کارکردها در نمایشگاه توانمندی های روستاییان و عشایر، نمره ای کمتر از 50 درصد را کسب کرده اند. بخش پایانی پژوهش حاضر به علت‌کاوی چرایی عدم استفاده مناسب از ظرفیت این نمایشگاه‌ها پرداخته شده است که پس از شناسایی این عوامل (در 19 مورد) به رتبه‌بندی آنها اقدام گردید.\n\n\n\n\u003ca class=\"sbtn\" href=\"https://bsrq.cuir.ac.ir/article_145896.html\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل کامل مقاله\u003c/a\u003e\n\n","tags":["تولید ملی"],"related":["a-1"],"link":"","authors":"مسعود شکری","year":"1400","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvnhjdynnse9","slug":"ai-chatbot-recruitment","kind":"article","subtype":"conference","title":"نقش چت بات های هوشمند در بهینه سازی فرایند جذب و استخدام در صنایع بزرگ","cover":"https://civilica.com/media/l/169284.webp","date":{"y":1404,"m":8,"d":2},"summary":"در عصر تحول دیجیتال، فناوری های نوین مانند چت بات های هوشمند به عنوان ابزارهایی نویدبخش در بهینه سازی فرایندهای منابع انسانی به ویژه در حوزه جذب و استخدام نیروی کار شناخته می شوند.","body":"در عصر تحول دیجیتال، فناوری های نوین مانند چت بات های هوشمند به عنوان ابزارهایی نویدبخش در بهینه سازی فرایندهای منابع انسانی به ویژه در حوزه جذب و استخدام نیروی کار شناخته می شوند. صنایع بزرگ با چالش هایی از قبیل حجم بالای متقاضیان، نیاز به پاسخگویی سریع و غربال گری اولیه موثر روبه رو هستند. در این میان، چت بات های مجهز به هوش مصنوعی می توانند با تعامل خودکار و هوشمند، نقش موثری در افزایش کارایی، صرفه جویی در زمان و بهبود تجربه متقاضیان ایفا کنند. چت بات ها با استفاده از تکنولوژی های پیشرفته مانند هوش مصنوعی و یادگیری ماشین، قادر به انجام فرآیندهای خودکار مانند غربالگری رزومه ها، انجام مصاحبه های اولیه و پاسخگویی به سوالات کارجویان هستند. این امر باعث کاهش زمان و هزینه های فرآیند جذب نیرو می شود و کارایی بیشتری به تیم های منابع انسانی می بخشد. علاوه بر این، چت بات ها می توانند تجربه کارجویان را بهبود بخشند و فرآیندهای پیچیده استخدام را برای آن ها ساده تر کنند. این مقاله با رویکردی مروری و تحلیلی به بررسی نقش و قابلیت های چت بات های هوشمند در فرآیند استخدام در صنایع بزرگ می پردازد و ضمن مرور مطالعات علمی، مزایا، چالش ها و پیامدهای احتمالی به کارگیری این فناوری را تحلیل می نماید.\n\n\n\u003ca class=\"sbtn\" href=\"https://civilica.com/doc/2350234/\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل مقاله\u003c/a\u003e\n\n","tags":["هوش مصنوعی","مدیریت منابع انسانی"],"related":["a-2"],"link":"","authors":"مسعود شکری","year":"1404","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvnhm353fank","slug":"systems-coaching-model","kind":"article","subtype":"conference","title":"تدوین مدل مربیگری مبتنی بر تفکر سیستمی برای حل مسائل پیچیده سازمانی","cover":"https://civilica.com/media/l/172151.webp?rnd=0.23281164314922953","date":{"y":1404,"m":11,"d":2},"summary":"در دنیای پیچیده و متغیر امروزی سازمان ها با مسائلی مواجه اند که ماهیتی پویا، چند بعدی و غیرخطی دارند حل این مسائل مستلزم نگرشی کل نگر و سیستمی است؛","body":"در دنیای پیچیده و متغیر امروزی سازمان ها با مسائلی مواجه اند که ماهیتی پویا، چند بعدی و غیرخطی دارند حل این مسائل مستلزم نگرشی کل نگر و سیستمی است؛ نگرشی که بتواند الگوهای تکرارشونده و روابط علی درون سازمان را آشکار سازد. از سوی دیگر، مربیگری به عنوان یکی از موثرترین رویکردهای توسعه فردی و سازمانی نقشی اساسی در پرورش مهارت های تفکر و حل مسئله دارد. با این حال بیشتر الگوهای موجود مربیگری فاقد نگاه سیستمی به پویایی های سازمانی هستند. پژوهش حاضر با هدف تدوین مدل مربیگری مبتنی بر تفکر سیستمی برای حل مسائل پیچیده سازمانی انجام شده و از نوع توصیفی-تحلیلی است. داده های تحقیق بر اساس مرور گسترده منابع علمی فارسی و انگلیسی، تحلیل محتوای متون کلیدی و ترکیب مفاهیم مرتبط در حوزه های مربیگری، تفکر سیستمی و حل مسئله استخراج شده است. نتیجه پژوهش ارائه چارچوبی مفهومی است که نشان می دهد مربیگری سیستمی می تواند با تمرکز بر الگوهای بازخورد، روابط متقابل و درک پویایی ها موجب ارتقای ظرفیت یادگیری و حل مسئله در سطوح فردی و سازمانی شود.\n\n\n\u003ca class=\"sbtn\" href=\"https://civilica.com/doc/2527330/\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل مقاله\u003c/a\u003e\n\n","tags":["تفکر سیستمی"],"related":[],"link":"","authors":"مسعود شکری","year":"1404","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvnholrr6hgt","slug":"st-cesm-innovation","kind":"article","subtype":"conference","title":"فراتر از تفکر سیستمی: تبیین پدیده نوآوری با چارچوب ترکیبی تفکر سیستمی–سیستم گرایی (ST–CESM)","cover":"https://civilica.com/media/l/170161.webp","date":{"y":1404,"m":7,"d":2},"summary":"تفکر سیستمی طی دهه های اخیر یکی از مهم ترین رویکردها برای تحلیل مسائل پیچیده و فهم پویایی های نظام های نوآوری بوده است.","body":"تفکر سیستمی طی دهه های اخیر یکی از مهم ترین رویکردها برای تحلیل مسائل پیچیده و فهم پویایی های نظام های نوآوری بوده است. با وجود این کارآمدی، نقدهایی اساسی به آن وارد شده است؛ از جمله غلبه نگاه الگو محور بر تبیین علی، دشواری استخراج سازوکارهای مولد پدیده ها، و فقدان چارچوبی که بتواند روابط میان اجزا، ساختار، محیط و فرآیندهای اثرگذار را به صورت صریح مدل سازی کند. در سال های اخیر، پارادایم «سیستم گرایی» و چارچوب CESM (ترکیب، محیط، ساختار، سازوکار) به عنوان پاسخی نوین برای تقویت تبیین سازوکارمحور پدیده های پیچیده مطرح شده اند. این مقاله با هدف فراتررفتن از مرزبندی سنتی میان تفکر سیستمی و سیستم گرایی، یک رویکرد تلفیقی با عنوان ST–CESM پیشنهاد می کند که نقاط قوت هر دو پارادایم را در کنار هم قرار می دهد. در این رویکرد، تفکر سیستمی برای ترسیم تصویر کلان، شناسایی الگوهای پویا و حلقه های بازخوردی به کار می رود، در حالی که مدل CESM برای تبیین سازوکارهای علی، فهم روابط ساختاری و تحلیل شرایط محیطی و نهادی مورد استفاده قرار می گیرد. برای نشان دادن کارآمدی این تلفیق، نظام نوآوری هوش مصنوعی به عنوان مطالعه موردی تحلیل می شود؛ حوزه ای که به دلیل چندبازیگری بودن، پیچیدگی ساختاری، و نقش برجسته سازوکارهای یادگیری، داده و رقابت، نمونه ای برجسته از نظام های نوآوری معاصر است. نتایج نشان می دهد که چارچوب ST–CESM می تواند شکاف میان «شناخت الگوهای سیستمی» و «تبیین سازوکارهای علی» را پر کرده و زمینه طراحی دقیق تر سیاست ها و مداخلات نوآورانه را فراهم آورد. این تلفیق نه تنها ظرفیت توضیحی رویکردهای سیستمی را ارتقا می دهد، بلکه برای مطالعات آینده در حوزه نوآوری و سیاست گذاری نیز چشم اندازی جدید فراهم می کند.\n\n\n\u003ca class=\"sbtn\" href=\"https://civilica.com/doc/2606234/\" style=\"background-color:#c08a2e;color:#1b1b1b\"\u003eدانلود فایل مقاله\u003c/a\u003e\n\n","tags":["تفکر سیستمی","روش‌شناسی سیستمی"],"related":["imvnhm353fank"],"link":"","authors":"مسعود شکری","year":"1404","price":"","status":"","featured":false,"visible":true,"comments":[]},{"id":"imvni05pb0vej","slug":"hbr-professional-hiring","kind":"book","subtype":"","title":"استخدام حرفه‌ای به سبک HBR","cover":"https://mlnnptmuk8v7.i.optimole.com/cb:nXhU.106f/w:550/h:550/q:mauto/f:best/https://www.shhejazi.com/wp-content/uploads/2026/09/%D8%B3%DB%8C%D8%AF-%D8%AD%D8%B3%DB%8C%D9%86-%D8%AD%D8%AC%D8%A7%D8%B2%DB%8C-%DA%A9%D8%AA%D8%A7%D8%A8-%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%AD%D8%B1%D9%81%D9%87-%D8%A7%DB%8C-%D8%A8%D9%87-%D8%B3%D8%A8%DA%A9-HBR.png","date":{"y":1404,"m":10,"d":2},"summary":"این کتاب گزیده‌ای کاربردی از مقالات هاروارد بیزینس ریویو (HBR) است که در ۷ بخش و ۲۷ فصل، تمام مراحل جذب را از نوشتن شرح شغل تا مصاحبه‌های شایستگی‌محور، استفاده از هوش مصنوعی در ارزیابی و تصمیم‌گیری نهایی آموزش می‌دهد.","body":"این کتاب گزیده‌ای کاربردی از مقالات هاروارد بیزینس ریویو (HBR) است که در ۷ بخش و ۲۷ فصل، تمام مراحل جذب را از نوشتن شرح شغل تا مصاحبه‌های شایستگی‌محور، استفاده از هوش مصنوعی در ارزیابی و تصمیم‌گیری نهایی آموزش می‌دهد.\n\n✍️مترجمین: سید حسین حجازی – مسعود شکری خیادانی\n\n🏢مرجع: Harvard Business Review (HBR)\n\n📄تعداد صفحات : 190صفحه (قطع وزیری)\n\n📑ساختار: ۷ بخش / ۲۷ فصل کاربردی","tags":["مدیریت منابع انسانی"],"related":["a-2"],"link":"","authors":"سید حسین حجازی، مسعود شکری","year":"1404","price":"","status":"","featured":false,"visible":true,"comments":[]}],"contact":{"intro":"برای همکاری پژوهشی، مشاوره یا پرسش درباره‌ی مقالات و پروژه‌ها از راه‌های زیر پیام بده.","email":"mshekari95@gmail.com","bale":"https://ble.ir/m_shekari","eitaa":"https://eitaa.com/m_shekari","telegram":"https://civilica.com/p/291528/","github":"","linkedin":"","website":""},"footer":{"copyright":"تمامی حقوق این وبسایت محفوظ و متعلق به مسعود شکری می‌باشد."}}</script>
<script>
(function () {
  'use strict';
  var D;
  try { D = JSON.parse(document.getElementById('site-data').textContent); } catch (e) { return; }

  var PAGES_DEF = {
    articles: {label: 'مقالات علمی', kind: 'article'}, books: {label: 'کتاب‌ها', kind: 'book'},
    notes: {label: 'یادداشت‌ها', kind: 'note'}, projects: {label: 'پروژه‌ها', kind: 'project'},
    products: {label: 'محصولات', kind: 'product'}, contact: {label: 'ارتباط'}, about: {label: 'درباره‌ی من'}
  };
  var KIND_PAGE = {article: 'articles', book: 'books', note: 'notes', project: 'projects', product: 'products'};
  var KIND_LABEL = {article: 'مقاله علمی', book: 'کتاب', note: 'یادداشت', project: 'پروژه', product: 'محصول'};
  var KIND_ORDER = ['article', 'book', 'note', 'project', 'product'];
  var SUB = {research: {label: 'علمی پژوهشی', cls: 'sub-r'}, conference: {label: 'کنفرانسی', cls: 'sub-c'}, specialist: {label: 'تخصصی', cls: 'sub-s'}};
  var LINK_LABEL = {article: 'مشاهده‌ی مقاله یا DOI', book: 'مشاهده یا خرید کتاب', note: 'مشاهده‌ی لینک', project: 'مشاهده‌ی پروژه', product: 'خرید یا مشاهده'};
  var LOGO = document.querySelector('.brand img').getAttribute('src');
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');
  var mobileMenu = document.getElementById('mobileMenu');

  /* DOM helper: user text only goes in via textContent or attributes */
  function h(tag, attrs, kids) {
    var n = document.createElement(tag), a = attrs || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') n.textContent = String(v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, String(v));
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  /* only http, https and mailto are allowed in links */
  function safeUrl(u) {
    try {
      var x = new URL(String(u || '').trim(), location.href);
      return ['http:', 'https:', 'mailto:'].indexOf(x.protocol) >= 0 ? x.href : null;
    } catch (e) { return null; }
  }
  function safeHttp(u) { var v = String(u || '').trim(); return /^https?:\/\//i.test(v) ? safeUrl(v) : null; }
  function fa(s) { return String(s == null ? '' : s).replace(/[0-9]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
  function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function fmtDate(d) { return d && d.y ? fa(d.y + '/' + pad(d.m) + '/' + pad(d.d)) : ''; }
  function dateKey(p) { var d = p.date || {}; return (d.y || 0) * 10000 + (d.m || 0) * 100 + (d.d || 0); }
  function paras(text) { return String(text || '').split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean); }
  function readMin(text) {
    var words = String(text || '').replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
    return words ? Math.max(1, Math.round(words / 180)) : 0;
  }
  function stars(n) { n = Math.max(0, Math.min(5, Math.round(+n || 0))); return '★'.repeat(n) + '☆'.repeat(5 - n); }
  function pageWrap(title, kids) {
    return h('section', {class: 'page'}, [h('div', {class: 'wrap'}, [h('h1', {class: 'page-title', text: title})].concat(kids))]);
  }
  function chipsEl(arr) {
    return h('div', {class: 'chips'}, (arr || []).map(function (t) { return h('span', {class: 'chip', text: t, dir: 'auto'}); }));
  }
  function copyBtn(text, label) {
    var b = h('button', {type: 'button', class: 'btn small ghost', text: label || 'کپی'});
    function done() { b.textContent = 'کپی شد'; setTimeout(function () { b.textContent = label || 'کپی'; }, 1500); }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      t.remove();
    }
    b.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });
    return b;
  }
  function ringEl(src, alt) {
    return h('div', {class: 'ring'}, [h('div', {class: 'ring-in'}, [h('img', {src: src, alt: alt || ''})])]);
  }

  /* ----- data helpers ----- */
  function visiblePages() {
    return (D.site.pages || []).filter(function (p) { return p.visible && PAGES_DEF[p.id]; }).map(function (p) { return p.id; });
  }
  function pageOn(id) { return visiblePages().indexOf(id) >= 0; }
  function items(kind, onlyVisible) {
    return (D.items || []).filter(function (i) {
      return (!kind || i.kind === kind) && (!onlyVisible || i.visible !== false);
    }).slice().sort(function (a, b) { return dateKey(b) - dateKey(a); });
  }
  function itemHref(i) { return '#/read/' + encodeURIComponent(i.slug || i.id); }
  function hayOf(i) {
    return [i.title, i.summary, (i.tags || []).join(' '), i.authors, KIND_LABEL[i.kind], SUB[i.subtype] ? SUB[i.subtype].label : ''].join(' ').toLowerCase();
  }
  function badgesFor(i) {
    var out = [h('span', {class: 'kbadge', text: KIND_LABEL[i.kind] || ''})];
    if (i.kind === 'article' && SUB[i.subtype]) out.push(h('span', {class: 'sbadge ' + SUB[i.subtype].cls, text: SUB[i.subtype].label}));
    return out;
  }

  /* ----- blocks ----- */
  function socialLinks() {
    var C = D.contact || {};
    var defs = [['email', '✉', 'ایمیل'], ['bale', 'ب', 'بله'], ['eitaa', 'ا', 'ایتا'], ['telegram', '➤', 'تلگرام'],
      ['linkedin', 'in', 'لینکدین'], ['github', '</>', 'گیت‌هاب']];
    return defs.map(function (d) {
      var v = String(C[d[0]] || '').trim();
      if (!v) return null;
      var ext = d[0] !== 'email';
      var href = ext ? safeHttp(v) : safeUrl('mailto:' + v);
      if (!href) return null;
      return h('a', {class: 'soc', href: href, title: d[2], 'aria-label': d[2], text: d[1],
        target: ext ? '_blank' : null, rel: ext ? 'noopener noreferrer' : null});
    }).filter(Boolean);
  }
  function heroBlock() {
    var H = D.hero || {};
    var photo = safeHttp(H.photo);
    return h('section', {class: 'hero', id: 'hero'}, [h('div', {class: 'wrap hero-grid'}, [
      h('div', {class: 'hero-txt'}, [
        h('span', {class: 'badge-gold', text: H.badge || ''}),
        h('h1', {}, [H.name || '', h('span', {class: 'name-en', dir: 'ltr', text: H.nameEn || ''})]),
        h('p', {class: 'sub', text: H.subtitle || ''}),
        h('p', {class: 'lead', text: H.intro || ''}),
        h('div', {class: 'btns'}, [
          h('a', {class: 'btn', href: pageOn('projects') ? '#/projects' : '#/contact', text: H.cta1 || 'نمونه کارها'}),
          h('a', {class: 'btn ghost', href: '#/contact', text: H.cta2 || 'تماس'})
        ])
      ]),
      ringEl(photo || LOGO, photo ? (H.name || '') : '')
    ])]);
  }
  function statsBlock() {
    var list = (D.stats || []).filter(function (s) { return s.visible !== false; });
    if (!list.length) return null;
    return h('section', {class: 'band', id: 'stats', 'aria-label': 'آمار'}, [h('div', {class: 'wrap stats'}, list.map(function (s) {
      return h('div', {class: 'stat'}, [h('b', {class: 'cnt', 'data-value': s.value || '', text: fa(s.value || '')}), h('span', {text: s.label || ''})]);
    }))]);
  }
  function itemCard(i) {
    var cover = safeHttp(i.cover), rm = readMin(i.body);
    return h('article', {class: 'card item-card'}, [
      cover ? h('a', {href: itemHref(i), tabindex: '-1', 'aria-hidden': 'true'}, [coverBox(cover)]) : null,
      h('div', {class: 'bdg'}, badgesFor(i)),
      h('h3', {}, [h('a', {href: itemHref(i), text: i.title || '', dir: 'auto'})]),
      h('p', {class: 'lead-s', text: i.summary || ''}),
      h('div', {class: 'meta-row'}, [h('time', {text: fmtDate(i.date)}), rm ? h('span', {text: 'حدود ' + fa(rm) + ' دقیقه مطالعه'}) : null]),
      h('a', {class: 'more', href: itemHref(i), text: 'ادامه‌ی مطلب'})
    ]);
  }
  function featCard(i) {
    return h('a', {class: 'feat-card', href: itemHref(i)}, [
      h('div', {class: 'bdg'}, badgesFor(i)),
      h('h3', {text: i.title || '', dir: 'auto'}),
      h('p', {text: i.summary || ''}),
      h('span', {class: 'feat-more', text: 'مطالعه ←'})
    ]);
  }
  function featuredStrip(list) {
    var f = list.filter(function (i) { return i.featured; }).slice(0, 4);
    if (!f.length) return null;
    return h('div', {class: 'featured'}, [h('span', {class: 'feat-head', text: 'منتخب'}), h('div', {class: 'feat-grid'}, f.map(featCard))]);
  }
  function latestSection(kind, list) {
    var pid = KIND_PAGE[kind];
    return h('section', {class: 'latest'}, [h('div', {class: 'wrap'}, [
      h('div', {class: 'sec-head'}, [h('h2', {text: 'آخرین ' + PAGES_DEF[pid].label}),
        pageOn(pid) ? h('a', {class: 'more', href: '#/' + pid, text: 'همه‌ی ' + PAGES_DEF[pid].label}) : null]),
      h('div', {class: 'grid'}, list.map(itemCard))
    ])]);
  }

  /* ----- pages ----- */
  function pageHome() {
    var H = D.site.home || {}, lat = H.latest || {}, parts = [];
    if (H.hero !== false) parts.push(heroBlock());
    if (H.stats) parts.push(statsBlock());
    KIND_ORDER.forEach(function (k) {
      var n = parseInt(lat[k], 10) || 0;
      if (n <= 0) return;
      var list = items(k, true).slice(0, n);
      if (list.length) parts.push(latestSection(k, list));
    });
    return h('div', {}, parts.filter(Boolean));
  }
  function pageKind(pageId, query) {
    var kind = PAGES_DEF[pageId].kind;
    var all = items(kind, true);
    var st = {q: '', sub: '', tag: query.tag || ''};
    var listEl = h('div', {class: 'grid'});
    var tagEl = h('div', {class: 'tagbar'});
    var q = h('input', {class: 'fin', type: 'search', placeholder: 'جستجو در ' + PAGES_DEF[pageId].label + '...', 'aria-label': 'جستجو'});
    var sub = null;
    if (kind === 'article') {
      sub = h('select', {class: 'fsel', 'aria-label': 'نوع مقاله'}, [
        h('option', {value: '', text: 'همه‌ی انواع'}),
        h('option', {value: 'research', text: 'علمی پژوهشی'}),
        h('option', {value: 'conference', text: 'کنفرانسی'}),
        h('option', {value: 'specialist', text: 'تخصصی'})
      ]);
    }
    var tagsAll = [];
    all.forEach(function (i) { (i.tags || []).forEach(function (t) { if (tagsAll.indexOf(t) < 0) tagsAll.push(t); }); });

    function draw() {
      var s = st.q.trim().toLowerCase();
      var list = all.filter(function (i) {
        return (!s || hayOf(i).indexOf(s) >= 0) && (!st.sub || i.subtype === st.sub) && (!st.tag || (i.tags || []).indexOf(st.tag) >= 0);
      });
      listEl.innerHTML = '';
      if (!list.length) listEl.appendChild(h('p', {class: 'empty', text: 'موردی با این فیلتر پیدا نشد.'}));
      else list.forEach(function (i) { listEl.appendChild(itemCard(i)); });
      tagEl.innerHTML = '';
      tagsAll.forEach(function (t) {
        var b = h('button', {type: 'button', class: 'tagbtn' + (st.tag === t ? ' on' : ''), text: t});
        b.addEventListener('click', function () { st.tag = st.tag === t ? '' : t; draw(); });
        tagEl.appendChild(b);
      });
